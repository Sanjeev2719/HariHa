<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="harihaRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF3833"/>
      <stop offset="50%" stop-color="#E52521"/>
      <stop offset="100%" stop-color="#C71814"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Premium Rounded Background Squircle -->
  <rect width="512" height="512" rx="105" fill="url(#harihaRedGrad)"/>
  
  <!-- Subtle Internal Luxury Border -->
  <rect x="12" y="12" width="488" height="488" rx="93" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

  <g filter="url(#subtleGlow)">
    <!-- Architectural Roof & Chimney Icon -->
    <path 
      d="M 68 232 L 195 142 L 236 171 V 142 H 262 V 189 L 320 232" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="26" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Brand Name: Hariha Infra -->
    <text 
      x="256" 
      y="312" 
      text-anchor="middle" 
      fill="#FFFFFF" 
      font-family="system-ui, -apple-system, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
      font-size="68" 
      font-weight="900" 
      letter-spacing="-1.5"
    >Hariha Infra</text>

    <!-- Tagline: Building dream homes since 2002 -->
    <text 
      x="256" 
      y="360" 
      text-anchor="middle" 
      fill="#FFFFFF" 
      font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
      font-size="21.5" 
      font-weight="600" 
      letter-spacing="0.2" 
      opacity="0.95"
    >Building dream homes since 2002</text>
  </g>
</svg>
